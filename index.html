<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Кибла</title>
<style>
  :root { color-scheme: dark light; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: #0f1115; color: #f2f2f2;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  #app { text-align: center; max-width: 380px; width: 100%; }
  h1 { font-size: 19px; font-weight: 600; margin: 0 0 8px; }
  p.hint { color: #9aa0a8; font-size: 14px; line-height: 1.45; margin: 0 0 22px; }

  #compass {
    position: relative;
    width: 250px; height: 250px; margin: 0 auto 20px;
    border-radius: 50%;
    border: 2px solid #2a2e37;
    background: radial-gradient(circle at 50% 45%, #1b1e25, #0f1115 72%);
  }
  #top-marker {
    position: absolute; top: -1px; left: 50%;
    transform: translate(-50%, -100%);
    width: 0; height: 0;
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-bottom: 10px solid #5a6272;
  }
  #arrow {
    position: absolute; left: 50%; top: 50%;
    width: 4px; height: 100px;
    background: #ffd27a;
    transform-origin: 50% 100%;
    transform: translate(-50%, -100%) rotate(0deg);
    transition: transform 0.12s linear;
    border-radius: 2px;
  }
  #arrow::before {
    content: "🕋";
    position: absolute; top: -26px; left: 50%;
    transform: translateX(-50%);
    font-size: 22px;
  }
  #center-dot {
    position: absolute; left: 50%; top: 50%;
    width: 8px; height: 8px; margin: -4px;
    border-radius: 50%; background: #5a6272;
  }

  #status { font-size: 15px; margin: 6px 0 4px; min-height: 20px; }
  #bearing { font-size: 13px; color: #9aa0a8; min-height: 18px; }
  .error { color: #e2574c !important; }

  button {
    margin-top: 18px; padding: 13px 26px; font-size: 15px; font-weight: 600;
    border: none; border-radius: 12px; background: #2f7a4f; color: white;
  }
  button:disabled { opacity: 0.5; }

  #debug {
    margin-top: 18px; padding: 10px; text-align: left; font-size: 11px;
    line-height: 1.6; color: #6b7280; background: #14161b; border-radius: 8px;
    white-space: pre-wrap; word-break: break-all;
  }
</style>
</head>
<body>
<div id="app">
  <h1>🕋 Направление киблы</h1>
  <p class="hint">
    Держите телефон горизонтально экраном вверх и медленно поворачивайтесь,
    пока стрелка не совпадёт с меткой наверху — вы будете обращены к Каабе.
  </p>

  <div id="debug"></div>

  <div id="compass">
    <div id="top-marker"></div>
    <div id="arrow"></div>
    <div id="center-dot"></div>
  </div>

  <div id="status">Нажмите «Начать», чтобы включить компас</div>
  <div id="bearing"></div>
  <button id="startBtn">Начать</button>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script>
(function () {
  "use strict";

  var KAABA_LAT = 21.4225;
  var KAABA_LON = 39.8262;

  var arrow = document.getElementById("arrow");
  var statusEl = document.getElementById("status");
  var bearingEl = document.getElementById("bearing");
  var startBtn = document.getElementById("startBtn");
  var debugEl = document.getElementById("debug");

  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    try { tg.ready(); tg.expand(); } catch (e) { /* not fatal */ }
  }

  function debug(line) {
    debugEl.textContent += line + "\n";
  }

  // Report SDK/environment status immediately on load, before any button
  // press — so we can diagnose even if geolocation/permission flow stalls.
  debug("Telegram.WebApp: " + !!tg);
  if (tg) {
    debug("TG version: " + tg.version);
    debug("TG.DeviceOrientation: " + !!tg.DeviceOrientation);
    if (tg.DeviceOrientation) {
      debug("DeviceOrientation.start is fn: " + (typeof tg.DeviceOrientation.start === "function"));
    }
  }
  debug("window.DeviceOrientationEvent: " + (typeof DeviceOrientationEvent !== "undefined"));
  if (typeof DeviceOrientationEvent !== "undefined") {
    debug("requestPermission is fn: " + (typeof DeviceOrientationEvent.requestPermission === "function"));
  }

  function toRad(d) { return (d * Math.PI) / 180; }
  function toDeg(r) { return (r * 180) / Math.PI; }

  function qiblaBearing(lat, lon) {
    var lat1 = toRad(lat), lon1 = toRad(lon);
    var lat2 = toRad(KAABA_LAT), lon2 = toRad(KAABA_LON);
    var dlon = lon2 - lon1;
    var x = Math.sin(dlon) * Math.cos(lat2);
    var y = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dlon);
    return (toDeg(Math.atan2(x, y)) + 360) % 360;
  }

  var qibla = null;
  var haveOrientation = false;

  function setStatus(text, isError) {
    statusEl.textContent = text;
    statusEl.className = isError ? "error" : "";
  }

  function pointArrowAt(heading, source) {
    haveOrientation = true;
    var pointAt = ((qibla - heading) + 360) % 360;
    arrow.style.transform = "translate(-50%, -100%) rotate(" + pointAt + "deg)";
    setStatus("Поворачивайтесь, пока стрелка не встанет наверх");
    debugEl.textContent =
      source + ": heading=" + heading.toFixed(1) +
      "° qibla=" + qibla.toFixed(1) + "° arrow=" + pointAt.toFixed(1) + "°";
  }

  // --- Path A: Telegram's own sensor bridge (Bot API 8.0+). Preferred inside
  // Telegram clients — raw browser DeviceOrientationEvent is frequently not
  // relayed through Telegram's WebView on Android/iOS, leaving the arrow frozen.
  function startTelegramOrientation() {
    if (!tg || !tg.DeviceOrientation || typeof tg.DeviceOrientation.start !== "function") {
      debug("TG DeviceOrientation not usable, falling back to browser API");
      return false;
    }
    try {
      tg.DeviceOrientation.start({ refresh_rate: 100, need_absolute: true }, function (started) {
        debug("TG DeviceOrientation.start callback: started=" + started);
        if (!started) {
          setStatus("Доступ к датчикам движения отклонён (Telegram).", true);
          return;
        }
        tg.onEvent("deviceOrientationChanged", function () {
          // Telegram reports alpha in radians; convert to a compass heading
          // (degrees, counter-clockwise-from-north like the raw web API).
          var alphaDeg = tg.DeviceOrientation.alpha * 180 / Math.PI;
          var heading = (360 - alphaDeg + 360) % 360;
          pointArrowAt(heading, "TG SDK");
        });
      });
      return true;
    } catch (e) {
      debug("TG SDK threw: " + e.message);
      return false;
    }
  }

  // --- Path B: raw browser DeviceOrientationEvent. Fallback for testing this
  // page outside Telegram, or on Telegram client versions below Bot API 8.0.
  function onBrowserOrientation(event) {
    var heading;
    if (typeof event.webkitCompassHeading === "number") {
      heading = event.webkitCompassHeading; // iOS Safari: true heading already
    } else if (typeof event.alpha === "number") {
      heading = 360 - event.alpha; // counter-clockwise from North -> clockwise
    } else {
      return;
    }
    pointArrowAt(heading, "browser (" + (event.absolute ? "absolute" : "relative") + ")");
  }

  function startBrowserOrientation() {
    var eventName = ("ondeviceorientationabsolute" in window)
      ? "deviceorientationabsolute"
      : "deviceorientation";
    debug("browser fallback, listening for: " + eventName);

    function attach() {
      window.addEventListener(eventName, onBrowserOrientation, true);
    }

    if (typeof DeviceOrientationEvent !== "undefined" &&
        typeof DeviceOrientationEvent.requestPermission === "function") {
      // iOS 13+: permission request must run inside a user-gesture handler.
      DeviceOrientationEvent.requestPermission()
        .then(function (result) {
          debug("requestPermission result: " + result);
          if (result === "granted") { attach(); }
          else { setStatus("Доступ к датчикам движения отклонён.", true); }
        })
        .catch(function (err) {
          debug("requestPermission rejected: " + err.message);
          setStatus("Не удалось запросить доступ к компасу.", true);
        });
    } else {
      attach();
    }
  }

  function startOrientation() {
    debug("Telegram.WebApp present: " + !!tg);
    if (tg) debug("TG version: " + tg.version + ", DeviceOrientation: " + !!tg.DeviceOrientation);

    var usingTelegram = startTelegramOrientation();
    if (!usingTelegram) {
      startBrowserOrientation();
    }

    setTimeout(function () {
      if (!haveOrientation) {
        setStatus("Датчик компаса недоступен или не даёт данных.", true);
        debug("no orientation data received after 3s");
      }
    }, 3000);
  }

  function startGeolocation() {
    if (!navigator.geolocation) {
      setStatus("Геолокация не поддерживается этим браузером.", true);
      return;
    }
    setStatus("Определяем местоположение…");
    navigator.geolocation.getCurrentPosition(
      function (pos) {
        qibla = qiblaBearing(pos.coords.latitude, pos.coords.longitude);
        bearingEl.textContent = "Кибла: " + Math.round(qibla) + "° от истинного севера";
        setStatus("Включаем компас…");
        startOrientation();
      },
      function (err) {
        setStatus("Не удалось получить геопозицию: " + err.message, true);
      },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  }

  startBtn.addEventListener("click", function () {
    startBtn.disabled = true;
    startGeolocation();
  });
})();
</script>
</body>
</html>
